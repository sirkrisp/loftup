[project]
name = "loftup"
version = "0.1.0"
description = "LoftUp: A Coordinate-Based Feature Upsampler for Vision Foundation Models"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    # CUDA 12.8 Torch stack supports RTX 50-series (Blackwell) GPUs.
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchaudio==2.7.1",
    # Training, configuration, and foundation models.
    "accelerate>=1.2,<2",
    "boto3>=1.35,<2", # Default training streams private B2 shards.
    "einops>=0.8,<1",
    "huggingface-hub>=0.30,<1",
    "hydra-core==1.3.2",
    "lightning-utilities>=0.11,<1",
    "omegaconf==2.3.0",
    "open-clip-torch>=2.30,<3",
    "peft>=0.14,<0.16",
    "pytorch-lightning>=2.5,<2.6",
    "safetensors>=0.4,<1",
    "schedulefree>=1.4,<2",
    "tensorboard>=2.18,<3",
    "timm>=1.0.15,<2",
    "tokenizers>=0.22,<0.23",
    "torchmetrics>=1.6,<2",
    "transformers>=4.56,<5",
    # Vision, numerical computing, and DAVIS evaluation.
    "cityscapesscripts>=2.2,<3",
    "kornia>=0.7,<1",
    "kornia-rs>=0.1,<1",
    "matplotlib>=3.8,<4",
    "networkx>=3.2,<4",
    "numpy==1.26.4",
    "opencv-python>=4.8,<4.12",
    "pandas>=2.2,<3",
    "pillow>=10,<12",
    "pycocotools>=2.0.8,<3",
    "pyquaternion>=0.9.9,<1",
    "scikit-image>=0.22,<0.26",
    "scikit-learn>=1.4,<2",
    "scipy>=1.12,<2",
    # Utilities and the bundled CLIP tokenizer.
    "absl-py>=2,<3",
    "ftfy>=6.2,<7",
    "ipython>=8,<9",
    "jinja2>=3.1,<4",
    "propcache>=0.2,<1",
    "protobuf>=5,<6",
    "regex>=2024.11.6",
    "requests>=2.32,<3",
    # maskclip imports packaging through pkg_resources.
    "setuptools==75.1.0",
    "tqdm>=4.66,<5",
    "termcolor>=2,<4",
    "wandb>=0.23,<1",
]

[project.optional-dependencies]
data-prep = ["rich>=13.9,<15"]
notebooks = ["jupyterlab>=4,<5", "ipywidgets>=8,<9"]

[tool.uv]
# Scripts import the source tree directly; this is an environment, not a wheel.
package = false
# Cityscapes requires the legacy typing backport; 3.10.0.0 excludes Python 3.11.
constraint-dependencies = ["typing<3.10"]
# Torch 2.7.1 pins NCCL 2.26.2, which can crash on multi-GPU RTX 5090 runs.
# Upstream reproduction and reported fix: pytorch/pytorch#152780.
override-dependencies = ["nvidia-nccl-cu12==2.26.5"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
