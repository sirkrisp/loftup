# Environment Args
output_root: 'output_dir'
resume_from: auto # Latest local checkpoint for this experiment; null starts fresh.
pytorch_data_dir: 'datasets'

# Dataset args
dataset: "sa1b_webdataset"

# SA-1B: cap the combined pool before the deterministic train/val split.
# Set sample size to null to use all available image/JSON pairs.
sa1b_sample_size: 1000000
sa1b_val_fraction: 0.05
sa1b_split_seed: 42

# The preparation run produced fixed-size shards of 1,000 samples each.
# Exactly 1M training images globally, independent of GPU/worker count.
webdataset:
  shards: ${oc.env:SA1B_WEBDATASET_SHARDS,'s3://sa1b-webdataset/sa1b-896/'}
  endpoint: ${oc.env:B2_ENDPOINT_URL,'https://s3.eu-central-003.backblazeb2.com'}
  samples_per_shard: 1000
  train_samples: 1000000
  val_samples: 5000 # Separate images after the training pool.
  train_batches: 1000 # Only used if train_samples=null (legacy cycling mode).
  val_batches: 100
  max_masks: 150
  shuffle_buffer: 32
  prefetch_factor: 1 # Bounds memory occupied by decoded SAM masks.

hf:
  enabled: true
  repo_id: Krispin/loftup
  retries: 3

# Model Args
model_type: "dinov3splus"
activation_type: "token"

# High-Resolution Training args
hr_res: 896
hr_weight: 20.0
consistency_method: "bilinear"

# Upsampling args
upsampler_type: "loftup"
n_freqs: 20
use_featup: false

# Training args
batch_size: 2
epochs: 1
num_workers: 8
lr: 1e-3
load_size: 224
upsample_size: 224
num_gpus: 4

# Jittering args
n_jitters: 2
max_pad: 8
max_zoom: 0.1
max_rotate: 5

# Loss weights
tv_weight: 0.05
filter_ent_weight: 0.0
rec_weight: 1.0

# Advanced features
affinity_loss: true
l1_affinity: false
use_prototypes: false
use_crop_upsampler: true

# Pretrained upsampler
pretrained_upsampler: "path/to/stage1_checkpoint.ckpt"

# SAM mask parameters
sam_mask_reg: 0.0
sam_mask_hr_alpha: 0.5
sam_mask_hr_reg: 0.0

# Other args
random_projection: 64
outlier_detection: True
zoom_only: false
multi_upsample_size: false
clamp_featup: false
aug_size: true
downsampler_type: "attention"

# Experiment tracking (TensorBoard remains enabled).
wandb:
  enabled: false
  project: loftup
  entity: null
  name: null
  group: null
  mode: online

# Fixed input images; falls back to validation examples if the folder is empty.
vis:
  enabled: true
  image_dir: vis/images
  max_images: 4
  every_n_steps: 500
  input_size: 224
  output_size: ${upsample_size}

# No need to change
hydra:
  run:
    dir: "."
  output_subdir: ~
